name: WhatsApp Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to perform'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - pair
          - logs
          - update-config
          - test-publish
          - publish-recent-5
          - inspect-channel
          - test-text-publish
          - check-fb-job

jobs:
  run-op:
    runs-on: ubuntu-latest
    steps:
      - name: Run WhatsApp Operation on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2244 }}
          command_timeout: 5m
          script: |
            TARGET_DIR="/var/www/jobbaskets/ms"
            cd $TARGET_DIR
            
            if [ "${{ github.event.inputs.action }}" = "status" ]; then
              echo "=== WhatsApp Status ==="
              curl -s http://127.0.0.1:3001/api/v1/whatsapp/status || true
              echo ""
              echo "=== Recent Logs ==="
              docker logs --tail 40 jobbaskets_social_poster
            elif [ "${{ github.event.inputs.action }}" = "pair" ]; then
              echo "=== Requesting Pairing Code ==="
              curl -s -X POST http://127.0.0.1:3001/api/v1/whatsapp/pair -H "Content-Type: application/json" -d '{"phoneNumber": "9943161027"}'
              echo ""
              echo "=== WhatsApp Status ==="
              curl -s http://127.0.0.1:3001/api/v1/whatsapp/status
              echo ""
              echo "=== Recent Logs ==="
              docker logs --tail 30 jobbaskets_social_poster
            elif [ "${{ github.event.inputs.action }}" = "update-config" ]; then
              echo "=== Updating WHATSAPP_CHANNEL_URL in .env ==="
              if grep -q "WHATSAPP_CHANNEL_URL" .env; then
                sed -i 's|^WHATSAPP_CHANNEL_URL=.*|WHATSAPP_CHANNEL_URL=https://whatsapp.com/channel/0029Vb7nef0LdQekQKYLCC0Z|' .env
              else
                echo "WHATSAPP_CHANNEL_URL=https://whatsapp.com/channel/0029Vb7nef0LdQekQKYLCC0Z" >> .env
              fi
              echo "Restarting social-poster container..."
              docker compose up -d --force-recreate
              sleep 6
              echo "=== WhatsApp Status after reload ==="
              curl -s http://127.0.0.1:3001/api/v1/whatsapp/status
              echo ""
              echo "=== Recent Logs ==="
              docker logs --tail 30 jobbaskets_social_poster
            elif [ "${{ github.event.inputs.action }}" = "test-publish" ]; then
              echo "=== Testing Social Publish to WhatsApp Channel ==="
              SECRET=$(grep "INTERNAL_SERVICE_SECRET" .env | cut -d '=' -f2)
              curl -s -X POST http://127.0.0.1:3001/api/v1/jobs/publish \
                -H "Content-Type: application/json" \
                -H "X-Internal-Service-Key: $SECRET" \
                -d '{
                  "job_id": 999999,
                  "uuid": "test-wa-live-001",
                  "title": "Senior React Native Developer",
                  "company_name": "JobBaskets Technologies",
                  "locations": ["Chennai", "Bangalore"],
                  "employment_type": "Full Time",
                  "experience_required": "3-5 Years",
                  "salary_min": 50000,
                  "salary_max": 80000,
                  "salary_currency": "INR",
                  "show_salary": true,
                  "skills": ["React Native", "TypeScript", "Redux"],
                  "target_platforms": ["whatsapp"],
                  "force": true
                }'
              sleep 5
              echo ""
              echo "=== Post Status ==="
              curl -s http://127.0.0.1:3001/api/v1/jobs/999999/social-status
              echo ""
              echo "=== Recent Logs ==="
              docker logs --tail 30 jobbaskets_social_poster
            elif [ "${{ github.event.inputs.action }}" = "publish-recent-5" ]; then
              echo "=== Dispatching Last 5 Published Jobs to WhatsApp ==="
              SECRET=$(grep "INTERNAL_SERVICE_SECRET" .env | cut -d '=' -f2)
              API_CONTAINER=$(docker ps --filter "name=api" --format "{{.Names}}" | grep -v "redis" | head -n 1)
              echo "Found API container: $API_CONTAINER"
              if [ -n "$API_CONTAINER" ]; then
                PAYLOADS=$(docker exec $API_CONTAINER php artisan tinker --execute="
                  \$jobs = \App\Models\JobPost::with(['company', 'consultancy', 'cities', 'city', 'skills'])
                    ->where('posting_status', 'publish')
                    ->latest('id')
                    ->take(5)
                    ->get();
                  
                  foreach (\$jobs as \$job) {
                    \$locations = [];
                    if (\$job->cities && \$job->cities->isNotEmpty()) {
                      \$locations = \$job->cities->map(fn (\$c) => \$c->city_name ?? \$c->name)->filter()->values()->all();
                    }
                    if (empty(\$locations) && \$job->city) {
                      \$locations[] = \$job->city->city_name ?? \$job->city->name;
                    }
                    
                    \$companyName = \$job->company?->company_name
                      ?? \$job->consultancy?->consultancy_name
                      ?? \$job->consultancy?->name
                      ?? 'JobBaskets Hiring Partner';
                    
                    \$companyLogo = \$job->company?->logo_url
                      ?? \$job->company?->logo
                      ?? \$job->consultancy?->logo_url
                      ?? \$job->consultancy?->logo;
                    
                    \$desc = \$job->description ? trim(html_entity_decode(strip_tags(\$job->description))) : null;
                    \$empType = \$job->employment_type ? str_replace('_', ' ', ucwords(\$job->employment_type, '_')) : null;
                    \$wType = \$job->work_type ? str_replace('_', ' ', ucwords(\$job->work_type, '_')) : null;
                    
                    \$p = [
                      'job_id' => (int) \$job->id,
                      'uuid' => (string) \$job->uuid,
                      'post_type' => (string) (\$job->post_type ?? 'standard'),
                      'title' => (string) \$job->title,
                      'description' => \$desc,
                      'company_name' => (string) \$companyName,
                      'company_logo' => \$companyLogo,
                      'image_url' => \$job->post_type === 'classified' ? \$job->ad_image_url : null,
                      'employment_type' => \$empType,
                      'work_type' => \$wType,
                      'locations' => \$locations,
                      'salary_min' => \$job->salary_min ? (float) \$job->salary_min : null,
                      'salary_max' => \$job->salary_max ? (float) \$job->salary_max : null,
                      'salary_currency' => '₹',
                      'salary_type' => \$job->salary_type,
                      'show_salary' => (bool) \$job->show_salary,
                      'skills' => \$job->skills ? \$job->skills->pluck('skill_name')->filter()->all() : [],
                      'experience_required' => \$job->experience_required,
                      'posted_at' => \$job->posted_at?->toISOString() ?? now()->toISOString(),
                      'target_platforms' => ['whatsapp'],
                      'force' => true
                    ];
                    echo '###JOB_PAYLOAD_START###' . json_encode(\$p) . '###JOB_PAYLOAD_END###' . PHP_EOL;
                  }
                ")

                echo "$PAYLOADS" | grep "###JOB_PAYLOAD_START###" | while read -r line; do
                  JSON_DATA=$(echo "$line" | sed 's/.*###JOB_PAYLOAD_START###//' | sed 's/###JOB_PAYLOAD_END###.*//')
                  JOB_TITLE=$(echo "$JSON_DATA" | grep -o '"title":"[^"]*"' | cut -d':' -f2 | tr -d '"')
                  echo "Posting to WhatsApp: $JOB_TITLE"
                  curl -s -X POST http://127.0.0.1:3001/api/v1/jobs/publish \
                    -H "Content-Type: application/json" \
                    -H "X-Internal-Service-Key: $SECRET" \
                    -d "$JSON_DATA"
                  echo ""
                  sleep 4
                done
              else
                echo "Could not find API container."
              fi
              sleep 8
              echo ""
              echo "=== Recent Social Poster Logs ==="
              docker logs --tail 40 jobbaskets_social_poster
            elif [ "${{ github.event.inputs.action }}" = "inspect-channel" ]; then
              echo "=== WhatsApp Channel & Viewer Metadata ==="
              curl -s http://127.0.0.1:3001/api/v1/whatsapp/channel || true
              echo ""
            elif [ "${{ github.event.inputs.action }}" = "test-text-publish" ]; then
              echo "=== Text-Only Test Publish to WhatsApp Channel ==="
              SECRET=$(grep "INTERNAL_SERVICE_SECRET" .env | cut -d '=' -f2)
              curl -s -X POST http://127.0.0.1:3001/api/v1/jobs/publish \
                -H "Content-Type: application/json" \
                -H "X-Internal-Service-Key: $SECRET" \
                -d '{
                  "job_id": 999998,
                  "uuid": "test-text-only-001",
                  "post_type": "standard",
                  "title": "WhatsApp Channel Test Post",
                  "company_name": "JobBaskets Technologies",
                  "locations": ["Chennai"],
                  "employment_type": "Full Time",
                  "experience_required": "2-4 Years",
                  "salary_min": 30000,
                  "salary_max": 60000,
                  "salary_currency": "INR",
                  "show_salary": true,
                  "skills": ["Testing"],
                  "target_platforms": ["whatsapp"]
                }'
              sleep 6
              echo ""
              echo "=== Recent Logs ==="
              docker logs --tail 30 jobbaskets_social_poster
            elif [ "${{ github.event.inputs.action }}" = "check-fb-job" ]; then
              echo "=== ALL DOCKER CONTAINERS ==="
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

              echo ""
              echo "=== CHECKING REDIS KEYS ACROSS ALL REDIS CONTAINERS ==="
              for rcon in $(docker ps --filter "name=redis" --format "{{.Names}}"); do
                echo "--- Redis Container: $rcon ---"
                ALL_KEYS=$(docker exec $rcon redis-cli KEYS "*" | tr -d '\r')
                echo "Keys count: $(echo "$ALL_KEYS" | wc -l)"
                echo "Matching social / bull / post keys:"
                echo "$ALL_KEYS" | grep -E "social|post|bull" || true
                for sk in $(echo "$ALL_KEYS" | grep -E "post_state|social" || true); do
                  echo "Dumping $sk:"
                  docker exec $rcon redis-cli HGETALL "$sk" || docker exec $rcon redis-cli GET "$sk" || true
                  echo ""
                done
              done

              echo ""
              echo "=== CHECKING API CONTAINERS & LARAVEL LOGS ==="
              for apicon in $(docker ps --filter "name=api" --format "{{.Names}}" | grep -v "redis"); do
                echo "--- API Container: $apicon ---"
                echo "Searching recent jobs in DB via $apicon:"
                docker exec $apicon php artisan tinker --execute="
                  echo '>> Searching CompanyMaster for Sun / Sivakasi / Publication:' . PHP_EOL;
                  \$comps = \App\Models\CompanyMaster::where('company_name', 'like', '%sun%')
                    ->orWhere('company_name', 'like', '%siva%')
                    ->orWhere('company_name', 'like', '%pub%')
                    ->get();
                  foreach (\$comps as \$c) {
                    echo 'Company: id=' . \$c->id . ', name=' . \$c->company_name . PHP_EOL;
                  }

                  echo '>> Searching ConsultancyMaster for Sun / Sivakasi / Publication:' . PHP_EOL;
                  \$cons = \App\Models\ConsultancyMaster::where('consultancy_name', 'like', '%sun%')
                    ->orWhere('consultancy_name', 'like', '%siva%')
                    ->orWhere('consultancy_name', 'like', '%pub%')
                    ->get();
                  foreach (\$cons as \$cn) {
                    echo 'Consultancy: id=' . \$cn->id . ', name=' . \$cn->consultancy_name . PHP_EOL;
                  }

                  echo '>> Jobs updated or created in the last 4 days:' . PHP_EOL;
                  \$recentJobs = \App\Models\JobPost::with(['company', 'consultancy'])
                    ->where('created_at', '>=', now()->subDays(4))
                    ->orWhere('updated_at', '>=', now()->subDays(4))
                    ->latest('id')
                    ->get();
                  foreach (\$recentJobs as \$j) {
                    \$cName = \$j->company?->company_name ?? \$j->consultancy?->consultancy_name ?? 'None';
                    echo 'JOB #' . \$j->id . ' | Title: ' . \$j->title . ' | Company/Consultancy: ' . \$cName . ' | Type: ' . \$j->post_type . ' | PostStatus: ' . \$j->posting_status . ' | AdminStatus: ' . \$j->admin_approval_status . ' | Created: ' . \$j->created_at . ' | Updated: ' . \$j->updated_at . PHP_EOL;
                  }

                  echo '>> Searching JobPost by any column matching Sun or Sivakasi:' . PHP_EOL;
                  \$matchJobs = \App\Models\JobPost::where('title', 'like', '%Sun%')
                    ->orWhere('title', 'like', '%Siva%')
                    ->orWhere('description', 'like', '%Sun%')
                    ->orWhere('description', 'like', '%Siva%')
                    ->latest('id')->take(5)->get();
                  foreach (\$matchJobs as \$mj) {
                    echo 'MATCHED JOB #' . \$mj->id . ' | Title: ' . \$mj->title . ' | Created: ' . \$mj->created_at . PHP_EOL;
                  }
                " || true

                echo "Checking Laravel log file for social-poster in $apicon:"
                docker exec $apicon tail -n 100 storage/logs/laravel.log 2>&1 | grep -i -C 3 "social-poster" || true
              done

              echo ""
              echo "=== SOCIAL POSTER CONTAINER LOGS ==="
              docker logs --tail 300 jobbaskets_social_poster 2>&1 | grep -i -E "error|fail|facebook|sun|sivakasi" | tail -n 80 || true
            elif [ "${{ github.event.inputs.action }}" = "logs" ]; then
              docker logs --tail 100 jobbaskets_social_poster
            fi
